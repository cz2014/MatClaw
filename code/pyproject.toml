[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matclaw"
version = "0.1.0"
description = "Code-first LLM agent for computational materials science"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the proven working set. smolagents 1.24.0 is vendored into
    # core/_smol/ (P2); litellm/rich/jinja2/huggingface-hub/pillow are its
    # runtime deps that core/_smol needs directly, pinned to the uv.lock
    # versions so resolution does not move.
    "litellm==1.86.1",
    "rich==14.3.4",
    "jinja2==3.1.6",
    "huggingface-hub==0.36.2",
    "pillow==12.2.0",
    "pymatgen==2025.10.7",
    "ase==3.27.0",
    "atomate2==0.0.23",
    "jobflow-remote==0.1.8",
    "pyyaml",
    "pymupdf>=1.24",
    # web_fetch: requests (promoted from transitive) + HTML->markdown. web_search needs
    # nothing new -- it calls litellm (above) for Gemini grounding.
    "requests",
    "markdownify",
    "jupyter_client==8.6.3",
    "ipykernel",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
matclaw = "core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "remote_jobs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default run = Unit tier only (offline, no LLM, no cluster). Opt in to the other tiers
# with `-m llm` (Live tier, Gemini 3.5 Flash) or `-m integration` (HPC cluster).
addopts = "-m 'not integration and not llm'"
markers = [
    "unit: offline, deterministic, no LLM/cluster (the gate)",
    "llm: needs a real LLM -- run with Gemini 3.5 Flash (the Live tier)",
    "integration: needs a real HPC/SSH/Mongo cluster (separate setup)",
    "docker: needs a running Docker daemon (the container smoke test); run with -m docker",
]

[tool.ruff]
line-length = 100
