# LLM configuration for MatClaw
# API keys use ${ENV_VAR} syntax - expanded at runtime

default_provider: claude

providers:
  openai:
    model_id: gpt-5.5
    api_key: ${OPENAI_API_KEY}
    context_window: 200000     # near-perfect at 256K (MRCR v2)
    reasoning_effort: high
    timeout: 1200              # detached high-effort runs hang on litellm.Timeout without this

  gemini:
    model_id: gemini/gemini-3.5-flash
    api_key: ${GEMINI_API_KEY}
    context_window: 100000     # Gemini 3.5 Flash (GA, Google I/O 2026); steep decay above 128K

  claude:
    model_id: anthropic/claude-opus-4-8
    api_key: ${CLAUDE_API_KEY}
    context_window: 200000
    timeout: 600
    thinking:
      type: adaptive
    output_config:
      effort: high

  deepseek:
    model_id: deepseek/deepseek-chat
    api_key: ${DEEPSEEK_API_KEY}
    context_window: 100000     # conservative default (no MRCR data)

# Agent execution settings
agent:
  max_steps: 100
  context_pruning: true         # enable zone-based context management (default: true)
  experience_file: experience.md   # resolved relative to config dir (configs/); cross-session lessons

  # web_search: Google Search via Gemini grounding. Configured like a provider above --
  # provider/model/api_key are all OPTIONAL, each falling back to providers.<provider>:
  #   provider: which configured provider backs search (default: gemini)
  #   model:    grounding model; else providers.<provider>.model_id; else gemini/gemini-3.5-flash
  #             (NOT gemini-2.5-flash: deprecated, retires 2026-10-16; gemini-3.1-flash-lite is cheaper)
  #   api_key:  ${ENV} template (your own env-var name); else providers.<provider>.api_key. Resolved
  #             like the agent's provider key and passed explicitly to litellm.
  web_search:
    provider: gemini
    model: gemini/gemini-3.5-flash
    api_key: ${GEMINI_API_KEY}     # omit to reuse providers.gemini.api_key

  # disabled_tools: remove these tool functions from the toolset (by name). Forbids ANY
  # registered tool; 'final_answer' cannot be disabled. Web access ships DISABLED by default --
  # remove these entries (or set `disabled_tools: []`) to turn it on.
  disabled_tools:
    - web_fetch
    - web_search

  additional_authorized_imports:
    - "*"   # P4: full access. The exec executor enforces no import policy (the P3 container is the
            # boundary); CodeAgent still renders this into {{authorized_imports}} and logs a one-time
            # "*" caution (benign).
  instructions: |
    Native open()/pathlib/subprocess are available. Convenience helpers are also provided:
    read_file/write_file/edit_file (workspace-relative IO), glob (find files), grep (ripgrep
    content search), and bash (captured shell). grep: Searches installed package sources
    (site-packages) by default; pass path= to search elsewhere, such as the doc corpus
    directories listed in the system prompt. A bash timeout returns control without killing
    the command; use wait_command/kill_command to re-enter or stop it, and
    run_in_background=True for known-long independent shell work. Use whichever interface
    fits the task.

    If real computations are requested, use jobflow-remote to submit jobs to remote HPC:
    - Prefer to use atomate2 Makers (e.g., RelaxMaker) to create jobs if possible, otherwise define custom jobs
    - Use submit_flow() to submit. wait_for_jobflow() is a bounded check-in: it returns the
      completed output, or timeout diagnostics after which you re-wait or act. Run it in a
      dedicated kernel (# kernel: hpc) and check in with wait_command("hpc") so the default
      kernel stays free
    - Output is a dict: e.g., output["output"]["energy"], output["output"]["structure"]

    BATCHING STRATEGY: Each SLURM job submission costs ~1-2 min overhead
    (queue registration, node allocation, environment setup). The batch worker
    reduces this overhead:

    BATCH WORKER (multiple Jobs -> one SLURM allocation, run one at a time):
       Packs the Jobs in a Flow into one SLURM allocation and runs them
       sequentially, paying the ~1-2 min queue overhead once instead of N times.
       Without it, N jobs also compete for the shared queue's concurrent
       submission limit, causing 30-60+ min wait per job.
       Rule: use the batch worker ONLY for many SHORT independent jobs (sub-node,
       minutes each -- e.g. a parameter sweep). For a SMALL number of LARGE
       full-node jobs (e.g. VASP relaxations of big cells), submit each as a
       separate anvil_cpu job instead -- they run in parallel across nodes and
       finish sooner, whereas the batch worker would serialize them.

    Use the STANDARD worker (anvil_cpu) for single or a few large/long Jobs.

    Queue selection: debug queue waits <10 min but caps at 27 min walltime.
    Shared queue waits 30-60+ min but allows up to 14h. Use debug when job
    runtime is under 27 min.

    CUSTOM JOB RESOURCES. submit_flow(flow, worker=..., resources=..., exec_config=...) lets you
    size a job; by default it uses the chosen worker's resources. To override (e.g. for more
    memory), pass a COMPLETE resources dict -- it REPLACES the worker default (NOT merged), so
    include EVERY field. Copy account/partition/time from the worker's config block shown in the
    worker list above (that block is injected automatically; the <...> below are filled there)
    and change only what you need:
        res = {"account": "<ACCOUNT>", "partition": "wholenode",
               "nodes": 1, "ntasks": 64, "cpus_per_task": 2, "time": "24:00:00"}
        submit_flow(flow, worker="anvil_cpu", resources=res,
                    exec_config=ExecutionConfig(export={"OMP_NUM_THREADS": "2"}))
    Per-rank memory budget = cpus_per_task * mem_per_core. If a job is OOM-killed, raise
    cpus_per_task (and OMP to match) or use worker="anvil_highmem"; lowering KPAR or setting NCORE
    in the Maker's user_incar_settings also cuts peak memory.

# Worker descriptions injected into agent instructions when project is specified.
# Keys are "{project}.{worker}" identifiers.
# description: Human-written text explaining when to use this worker.
# The raw jfremote worker config is also injected automatically.

workers:
  perlmutter.perlmutter_debug:
    description: >
      DEFAULT. Use this unless you have a specific reason not to.
      A100 GPU, debug queue. Queue wait: <5 minutes. Walltime limit: 27 min.
      Most jobs finish well within 27 min. Always start here.

  perlmutter.perlmutter_gpu:
    description: >
      DO NOT use this unless a single job absolutely requires >27 min walltime.
      A100 GPU, shared queue. Queue wait: 1-4 HOURS. Walltime: 14h. Max 10 concurrent.
      Using this for short jobs wastes hours waiting in queue. Think before choosing this.

  perlmutter.perlmutter_batch:
    description: >
      DO NOT use for single jobs or small flows.
      Batch worker: packs up to 5000 jobs into one SLURM submission (4 parallel).
      A100 GPU, shared queue. Queue wait: 1-4 HOURS. Walltime: 14h.
      ONLY use when a Flow has 2+ independent jobs to amortize the queue wait.

  anvil.anvil_cpu:
    description: >
      Standard worker: one SLURM job per Job, 128-core CPU wholenode,
      up to 32 concurrent jobs, 24h walltime. Use for a single or large
      MPI-parallel VASP job that needs the full node.

  anvil.anvil_batch:
    description: >
      Batch worker: packs many small INDEPENDENT short jobs into ONE wholenode
      allocation and runs them ONE AT A TIME, paying the queue wait once.
      Use ONLY for many short jobs (e.g. a parameter sweep). For large full-node
      MPI VASP jobs, or just a few jobs, use anvil_cpu -- separate submissions
      run in parallel across nodes and finish sooner.

  anvil.anvil_shared:
    description: >
      SHARED queue: partial-node, per-core billing (1x), ~1.9 GB/core. Small or partial-node
      jobs and quick tests; usually the shortest queue. More memory per rank -> raise cpus_per_task.
  anvil.anvil_highmem:
    description: >
      HIGHMEM queue: ~8 GB/core, 24h. Use when a VASP job OOM-kills on anvil_cpu (large/long
      cell, high ENAUG, or KPAR>1). Bills ~4x SU and only 32 nodes (longer queue); memory-bound only.
