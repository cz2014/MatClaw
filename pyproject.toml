[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matclaw"
version = "0.1.0"
description = "Code-first LLM agent for computational materials science"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the proven ~/ag2 working set (also keeps the prebuilt RAG corpus
    # in data/corpus/ aligned with these API versions).
    "smolagents[litellm]==1.24.0",
    "pymatgen==2025.10.7",
    "ase==3.27.0",
    "atomate2==0.0.23",
    "dpdata==1.0.0",
    "jobflow-remote==0.1.8",
    "pyyaml",
    "bm25s>=0.2",
    "tiktoken>=0.5",
    "astchunk",
    "faiss-cpu>=1.7",
    "google-genai>=0.3",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
telemetry = [
    "arize-phoenix",
    "openinference-instrumentation-smolagents",
]

[project.scripts]
matclaw = "core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.ruff]
line-length = 100
