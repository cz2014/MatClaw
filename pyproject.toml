[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlff-agent"
version = "0.1.0"
description = "Code-first agent for ML force-field workflows"
readme = "project_intro.md"
requires-python = ">=3.10"
dependencies = [
    "smolagents[litellm]",
    "pymatgen",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
workflow = [
    "jobflow",
    "fireworks",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.ruff]
line-length = 100
