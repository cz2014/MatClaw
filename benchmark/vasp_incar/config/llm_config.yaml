# VASP INCAR benchmark LLM configuration
# Mirrors benchmark/tasks/config/llm_config.yaml with file I/O additions

default_provider: claude-sonnet

providers:
  openai:
    model_id: gpt-4o
    api_key: ${OPENAI_API_KEY}

  gemini:
    model_id: gemini/gemini-3-flash-preview
    api_key: ${GEMINI_API_KEY}
    timeout: 600

  deepseek:
    model_id: deepseek/deepseek-chat
    api_key: ${DEEPSEEK_API_KEY}

  claude-opus:
    model_id: anthropic/claude-opus-4-6
    api_key: ${CLAUDE_API_KEY}
    timeout: 600

  claude-sonnet:
    model_id: anthropic/claude-sonnet-4-6
    api_key: ${CLAUDE_API_KEY}
    timeout: 600

# Agent execution settings
agent:
  max_steps: 30
  instructions: |-
    You have access to these file I/O functions:
    - write_text(path, content) -> str  (writes file under workspace, returns absolute path)
    - read_text(path) -> str  (reads file from workspace)
    Never use open() for file operations. Always use write_text/read_text directly. These two functions are already imported.

    ## Error handling rules
    Do NOT wrap your entire solution in a single broad try/except that catches all
    exceptions and returns None for every property. This hides real bugs (TypeError,
    KeyError, AttributeError) and prevents you from seeing the traceback and fixing
    the code.

    Instead:
    - Let errors surface naturally so you can read the traceback and fix the bug.
    - If you must handle errors, isolate each independent property in its own small
      try/except so one failure does not wipe out all outputs.
    - Only set a value to None when the failure is truly unavoidable (e.g. missing
      optional data), and print a brief reason why.
    - TypeError, KeyError, and AttributeError are almost always fixable bugs. Let
      them raise so you can retry with the correct code.

    ## VASP INCAR generation
    We use standard VASP without any third-party patches (no VTST extensions).
    Do NOT include VTST-only tags such as LCLIMB, ICHAIN, IOPT, or LTANGENTOLD.
    Standard VASP NEB uses only IMAGES and SPRING.

    Always use atomate2 input set generators to produce INCAR files:
    - Relaxation: RelaxSetGenerator(user_incar_settings={...})
    - NEB: NebSetGenerator(climbing_image=False, num_images=N, user_incar_settings={...})
    Set climbing_image=False because we run standard VASP without VTST.
    Read the POSCAR files from your workspace to pass structures to the generators.
  additional_authorized_imports:
    - pathlib
    - math
    - json
    - os
    - numpy
    - numpy.*
    - scipy
    - scipy.*
    - pymatgen
    - pymatgen.*
    - atomate2
    - atomate2.*
    - inspect
