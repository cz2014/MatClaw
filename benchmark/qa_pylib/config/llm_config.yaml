# QA benchmark LLM configuration
# Uses same providers as main config, with QA-specific agent settings

default_provider: gemini

providers:
  openai:
    model_id: gpt-5.2
    api_key: ${OPENAI_API_KEY}
    timeout: 120

  gemini:
    model_id: gemini/gemini-3-flash-preview
    api_key: ${GEMINI_API_KEY}
    timeout: 120

  deepseek:
    model_id: deepseek/deepseek-chat
    api_key: ${DEEPSEEK_API_KEY}

# Agent execution settings (QA-specific)
agent:
  max_steps: 5
  additional_authorized_imports:
    - math
    - numpy
