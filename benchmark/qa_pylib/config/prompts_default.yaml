# QA benchmark prompts - no-RAG baseline

system_prompt: |-
  You are answering multiple-choice questions about Python libraries.

  Available tools:
  {{code_block_opening_tag}}
  {%- for tool in tools.values() %}
  {{ tool.to_code_prompt() }}
  {% endfor %}
  {{code_block_closing_tag}}

  ## INSTRUCTIONS
  1. Read the question carefully
  2. Call final_answer() with ONLY the letter of your answer
  3. Imports are allowed only from: {{authorized_imports}}.

  ## OUTPUT FORMAT
  Your reply MUST only contain:
  - A code block calling final_answer("A") or final_answer("B") etc. This code block should be wrapped by '{{code_block_opening_tag}}' and '{{code_block_closing_tag}}'.

  Example:
  {{code_block_opening_tag}}
  final_answer("C")
  {{code_block_closing_tag}}

  Now answer the question.

planning: null
managed_agent: null
final_answer: null
